# DonaVida: todo lo que llegue por HTTP se manda a HTTPS
server {
    listen       80;
    server_name  donavida.local;
    return 301 https://$host$request_uri;
}

# DonaVida: sitio con HTTPS que pasa las visitas a Express
server {
    listen       443 ssl;
    server_name  donavida.local;

    ssl_certificate      C:/nginx/conf/ssl/donavida.local.crt;
    ssl_certificate_key  C:/nginx/conf/ssl/donavida.local.key;
    ssl_protocols        TLSv1.2 TLSv1.3;

    # Oculta la versión de Nginx en las respuestas
    server_tokens off;

    # Encabezados de seguridad
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
